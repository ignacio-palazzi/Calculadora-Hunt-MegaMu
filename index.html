<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Hunt - MoK'Nathal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

        :root {
            --bg-color: #1a0000;
            --container-bg: #2b0000;
            --border-color: #5d0000;
            --text-color: #fcebeb;
            --accent-color: #e74c3c;
            --dark-accent: #c0392b;
            --disabled-bg: #4d1d1d;
            --error-color: #ff0000;
            --success-color: #2ecc71;
            --glow-color: #ff5252;
        }

        body {
            font-family: 'Cinzel', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }

        .calculator-section, .quest-section {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            position: relative;
        }

        .calculator-section {
            flex: 2;
            min-width: 450px;
        }

        .quest-section {
            flex: 1;
            min-width: 300px;
        }

        h1, h2 {
            text-align: center;
            color: var(--accent-color);
            text-shadow: 0 0 5px var(--dark-accent);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input[type="number"] {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid var(--border-color);
            background-color: #3d0303;
            color: var(--text-color);
            border-radius: 5px;
            font-size: 16px;
            font-family: 'Cinzel', serif;
        }

        .attributes-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .attribute-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 5px;
            background-color: #330000;
        }

        .attribute-item label {
            width: 110px;
            font-size: 0.9em;
        }

        .attribute-item input {
            width: 60px;
            text-align: center;
            font-family: 'Cinzel', serif;
            padding: 5px;
            border: 1px solid var(--border-color);
            background-color: #3d0303;
            color: var(--text-color);
            border-radius: 4px;
        }

        .attribute-value {
            font-weight: bold;
            color: var(--accent-color);
            min-width: 90px;
            text-align: right;
        }

        .attribute-value.capped {
            color: var(--error-color);
            text-shadow: 0 0 5px var(--error-color);
        }

        #porcentaje-total-display {
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            background-color: var(--border-color);
            border: 1px dashed var(--accent-color);
        }

        .porcentaje-ok {
            color: var(--success-color);
        }

        .porcentaje-nok {
            color: var(--error-color);
        }

        .divider {
            border-top: 2px solid var(--border-color);
            margin: 20px 0;
        }

        .quest-options {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .quest-options label {
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
            margin: 5px;
            transition: color 0.3s;
        }

        .quest-options label:hover {
            color: var(--accent-color);
        }

        .quest-options input[type="radio"] {
            margin-right: 5px;
            accent-color: var(--accent-color);
        }

        .quest-inputs-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            background-color: #330000;
            padding: 15px;
            border-radius: 5px;
            border: 1px dashed var(--border-color);
        }

        .quest-inputs-grid .input-group label {
            font-size: 0.9em;
        }

        input:disabled {
            background-color: var(--disabled-bg);
            cursor: not-allowed;
            color: #999;
        }

        .optimal-allocation {
            font-size: 0.8em;
            color: var(--text-color);
            opacity: 0.7;
            width: 110px;
            text-align: right;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9em;
            color: var(--text-color);
            opacity: 0.6;
            width: 100%;
        }

        .header-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%   { text-shadow: 0 0 5px var(--dark-accent); }
            50%  { text-shadow: 0 0 10px var(--glow-color), 0 0 20px var(--glow-color); }
            100% { text-shadow: 0 0 5px var(--dark-accent); }
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
            .calculator-section, .quest-section {
                width: 100%;
                min-width: unset;
                max-width: 550px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="calculator-section">
        <h1 class="header-glow">Calculadora de Hunt - MoK'Nathal</h1>

        <div class="input-group">
            <label for="nivel">Nivel del Personaje:</label>
            <input type="number" id="nivel" value="0" min="0" step="1">
        </div>

        <div class="divider"></div>

        <h2>Distribución de Atributos (%)</h2>
        <div class="attributes-grid"></div>

        <div id="porcentaje-total-display">
            Total de Porcentaje: <span id="porcentaje-total">0</span>%
        </div>
    </div>

    <div class="quest-section">
        <h2>Valores del Item Quest</h2>
        <div class="quest-options">
            <label><input type="radio" name="quest-type" value="damage" checked> Quest de Damage</label>
            <label><input type="radio" name="quest-type" value="wizardry"> Quest de Wizardry</label>
<label><input type="radio" name="quest-type" value="custom"> Personalizada</label>
        </div>
        <div id="quest-values-container" class="quest-inputs-grid"></div>
    </div>
</div>

<div class="footer">
    Desarrollado por Soriente
</div>

<script>
    const nivelInput = document.getElementById('nivel');
    const questOptions = document.querySelectorAll('input[name="quest-type"]');
    const questValuesContainer = document.getElementById('quest-values-container');
    const attributesGrid = document.querySelector('.attributes-grid');
    const porcentajeTotalDisplay = document.getElementById('porcentaje-total');

    const atributosData = [
        { id: 'damage',    label: 'Daño (Damage)',      multiplier: 120,  cap: 65000 },
        { id: 'defense',   label: 'Defensa (Defense)',  multiplier: 150,  cap: 65000 },
        { id: 'hp',        label: 'Vida (HP)',           multiplier: 600,  cap: 65000 },
        { id: 'mana',      label: 'Maná (Mana)',         multiplier: 600,  cap: 65000 },
        { id: 'wizardry',  label: 'Magia (Wizardry)',    multiplier: 200,  cap: 65000 },
        { id: 'recovery',  label: 'Recuperación',        multiplier: 0.3,  cap: null  },
        { id: 'critical',  label: 'Crítico (Critical)',  multiplier: 0.6,  cap: null  },
        { id: 'excellent', label: 'Excelente (Excellent)', multiplier: 0.6, cap: null }
    ];

    const questsData = {
        'damage':   { damage: 21200, defense: 2100,  hp: 9750,  mana: 0, wizardry: 0,     recovery: 0, critical: 3, excellent: 4 },
        'wizardry': { damage: 0,     defense: 2100,  hp: 12950, mana: 0, wizardry: 13510, recovery: 0, critical: 3, excellent: 4 },
'custom':   { damage: 0,     defense: 0,     hp: 0,     mana: 0, wizardry: 0,     recovery: 0, critical: 0, excellent: 0 }
    };

    function createAttributeInputs() {
        attributesGrid.innerHTML = '';
        atributosData.forEach(atributo => {
            const item = document.createElement('div');
            item.classList.add('attribute-item');
            item.innerHTML = `
                <label for="${atributo.id}-perc">${atributo.label}:</label>
                <input type="number" id="${atributo.id}-perc" class="porcentaje" value="0" min="0" max="100">
                <span>% = <span id="${atributo.id}-valor" class="attribute-value">0</span></span>
                ${atributo.cap !== null ? `<span id="${atributo.id}-optimal" class="optimal-allocation"></span>` : ''}
            `;
            attributesGrid.appendChild(item);
        });
        document.querySelectorAll('.porcentaje').forEach(input => {
            input.addEventListener('input', calcularAtributos);
        });
    }

    function createQuestInputs() {
        questValuesContainer.innerHTML = '';
        atributosData.forEach(atributo => {
            const inputGroup = document.createElement('div');
            inputGroup.classList.add('input-group');
            inputGroup.innerHTML = `
                <label for="quest-${atributo.id}">${atributo.label}:</label>
                <input type="number" id="quest-${atributo.id}" class="quest-input" value="0" min="0" step="1">
            `;
            questValuesContainer.appendChild(inputGroup);
        });
        document.querySelectorAll('.quest-input').forEach(input => {
            input.addEventListener('input', () => {
                const selectedQuestType = document.querySelector('input[name="quest-type"]:checked').value;
                if (selectedQuestType === 'custom') {
                    const atributoId = input.id.replace('quest-', '');
                    questsData.custom[atributoId] = parseFloat(input.value) || 0;
                    calcularAtributos();
                }
            });
        });
    }

    function updateQuestInputs() {
        const selectedQuestType = document.querySelector('input[name="quest-type"]:checked').value;
        const isCustom = selectedQuestType === 'custom';
        const currentQuestValues = isCustom ? questsData['custom'] : questsData[selectedQuestType];

        document.querySelectorAll('.quest-input').forEach(input => {
            const atributoId = input.id.replace('quest-', '');
            input.value = currentQuestValues[atributoId];
            input.disabled = !isCustom;
        });
        calcularAtributos();
    }

    function calcularAtributos() {
        const nivel = parseFloat(nivelInput.value) || 0;
        let porcentajeTotal = 0;

        document.querySelectorAll('.porcentaje').forEach(input => {
            porcentajeTotal += parseFloat(input.value) || 0;
        });

        const porcentajeOK = porcentajeTotal.toFixed(0) === '100';
        porcentajeTotalDisplay.innerText = porcentajeTotal.toFixed(0);
        const totalDisplayContainer = document.getElementById('porcentaje-total-display');
        if (porcentajeOK) {
            totalDisplayContainer.classList.remove('porcentaje-nok');
            totalDisplayContainer.classList.add('porcentaje-ok');
        } else {
            totalDisplayContainer.classList.remove('porcentaje-ok');
            totalDisplayContainer.classList.add('porcentaje-nok');
        }

        const questBonus = {};
        document.querySelectorAll('.quest-input').forEach(input => {
            const atributoId = input.id.replace('quest-', '');
            questBonus[atributoId] = parseFloat(input.value) || 0;
        });

        atributosData.forEach(atributo => {
            const porcentajeInput = document.getElementById(`${atributo.id}-perc`);
            const porcentaje = parseFloat(porcentajeInput.value) || 0;
            const atributoValorSpan = document.getElementById(`${atributo.id}-valor`);
            const optimalSpan = document.getElementById(`${atributo.id}-optimal`);

            const valorNivel = nivel * (porcentaje / 100) * atributo.multiplier;
            let valorFinal = valorNivel + questBonus[atributo.id];

            if (atributo.cap !== null && valorFinal > atributo.cap) {
                valorFinal = atributo.cap;
                atributoValorSpan.classList.add('capped');
            } else {
                atributoValorSpan.classList.remove('capped');
            }

            atributoValorSpan.innerText = valorFinal.toFixed(2);

            if (atributo.cap !== null && optimalSpan) {
                if (nivel > 0) {
                    const puntosParaCap = atributo.cap - questBonus[atributo.id];
                    const puntosNivelNecesarios = puntosParaCap / atributo.multiplier;
                    let porcentajeIdeal = (puntosNivelNecesarios / nivel) * 100;
                    optimalSpan.innerText = `(Óptimo: ${porcentajeIdeal.toFixed(2)}%)`;
                } else {
                    optimalSpan.innerText = `(Óptimo: 0.00%)`;
                }
            }
        });
    }

    questOptions.forEach(radio => {
        radio.addEventListener('change', updateQuestInputs);
    });
    nivelInput.addEventListener('input', calcularAtributos);

    createAttributeInputs();
    createQuestInputs();
    updateQuestInputs();
</script>

</body>
</html>
